<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#23262d" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <!-- Linear Gradients for Waveform & Badges -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Vignette Glow -->
    <radialGradient id="vignette" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="#09090b"/>

  <!-- Subsurface Glow -->
  <rect width="1200" height="420" fill="url(#vignette)"/>

  <!-- Industrial Card Enclosure -->
  <rect x="12" y="12" width="1176" height="396" rx="6" fill="#111317" stroke="#23262d" stroke-width="1.5"/>

  <!-- Technical Grid Overlay -->
  <rect x="14" y="14" width="1172" height="392" fill="url(#grid)"/>

  <!-- Corner Reticles / Industrial Calibration Crosshairs -->
  <g stroke="#3f3f46" stroke-width="1.5" fill="none">
    <path d="M 28 40 L 28 28 L 40 28"/>
    <path d="M 1172 40 L 1172 28 L 1160 28"/>
    <path d="M 28 380 L 28 392 L 40 392"/>
    <path d="M 1172 380 L 1172 392 L 1160 392"/>
  </g>

  <!-- Top Status Bar & Chips -->
  <g transform="translate(48, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="186" height="26" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="13" cy="13" r="4" fill="#10b981"/>
    <text x="25" y="17" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">SYSTEM OPERATIONAL</text>

    <!-- Node Architecture Chip -->
    <rect x="196" y="0" width="148" height="26" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="17" transform="translate(196, 0)" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8">ESP-NOW MESH 2.4G</text>

    <!-- Latency / Protocol Chip -->
    <rect x="354" y="0" width="158" height="26" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="17" transform="translate(354, 0)" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8">DYNAMIC 3σ WELFORD</text>
  </g>

  <!-- Main Hero Brand Typography -->
  <g transform="translate(48, 142)">
    <!-- Brand Title -->
    <text x="0" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="6">AXON</text>
    <rect x="236" y="12" width="60" height="24" rx="4" fill="#18181b" stroke="#23262d" stroke-width="1"/>
    <text x="245" y="28" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">v1.0</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="86" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
      Autonomous Predictive Maintenance &amp; WhatsApp Dispatch for MSMEs
    </text>

    <!-- Description Paragraph -->
    <text x="2" y="118" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="0.1">
      Procedural 3D Digital Twin · 7-Day Unsupervised Baseline · Zero-Wi-Fi Shopfloor Mesh · Direct Phone Dispatch
    </text>
  </g>

  <!-- Technical Telemetry Footer Badges -->
  <g transform="translate(48, 332)">
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="4" fill="#141519" stroke="#23262d" stroke-width="1"/>
      <text x="12" y="15" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.5">ACOUSTIC SENSOR</text>
      <text x="12" y="27" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">AE-01 · 48 kHz</text>
    </g>

    <g transform="translate(157, 0)">
      <rect width="145" height="34" rx="4" fill="#141519" stroke="#23262d" stroke-width="1"/>
      <text x="12" y="15" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.5">PRESSURE SENSOR</text>
      <text x="12" y="27" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">PT-01 · 16 BAR</text>
    </g>

    <g transform="translate(314, 0)">
      <rect width="145" height="34" rx="4" fill="#141519" stroke="#23262d" stroke-width="1"/>
      <text x="12" y="15" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.5">GATEWAY HUB</text>
      <text x="12" y="27" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">GW-01 · IP67</text>
    </g>

    <g transform="translate(471, 0)">
      <rect width="158" height="34" rx="4" fill="#141519" stroke="#23262d" stroke-width="1"/>
      <text x="12" y="15" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.5">AGENT DISPATCH</text>
      <text x="12" y="27" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">WHATSAPP · 1-CLICK</text>
    </g>
  </g>

  <!-- Right Graphic: Stylized 3D Mesh / Acoustic Waveform Spectrum Visualizer -->
  <g transform="translate(710, 48)">
    <!-- Enclosure for Visualizer -->
    <rect x="0" y="0" width="440" height="324" rx="6" fill="#0d0e12" stroke="#23262d" stroke-width="1.2"/>
    
    <!-- Top Bar inside Card -->
    <path d="M 0 32 L 440 32" stroke="#1f222a" stroke-width="1"/>
    <circle cx="20" cy="16" r="3.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="34" cy="16" r="3.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="48" cy="16" r="3.5" fill="#10b981" opacity="0.8"/>
    <text x="70" y="20" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600">LIVE TELEMETRY SPECTRUM · C-01 COMPRESSOR</text>

    <!-- Hairline Threshold Line (Dynamic Envelope μ + 3σ) -->
    <path d="M 30 115 L 410 115" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.85"/>
    <text x="320" y="108" fill="#ef4444" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700">3σ ENVELOPE (LIMIT)</text>

    <!-- Normal Operating Baseline (μ) -->
    <path d="M 30 185 L 410 185" stroke="#10b981" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
    <text x="320" y="198" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600">MEAN BASELINE (μ)</text>

    <!-- Waveform Area Fill -->
    <path d="M 30 270 
             L 50 260 L 70 264 L 90 250 L 110 258 L 130 235 L 150 240 
             L 170 210 L 190 225 L 210 160 L 230 180 L 250 130 L 270 150 
             L 290 120 L 310 195 L 330 215 L 350 235 L 370 248 L 390 260 L 410 265
             L 410 270 Z" 
          fill="url(#fillGrad)"/>

    <!-- Acoustic Waveform Line -->
    <path d="M 30 270 
             L 50 260 L 70 264 L 90 250 L 110 258 L 130 235 L 150 240 
             L 170 210 L 190 225 L 210 160 L 230 180 L 250 130 L 270 150 
             L 290 120 L 310 195 L 330 215 L 350 235 L 370 248 L 390 260 L 410 265" 
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Mesh Nodes & Interconnects -->
    <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
      <line x1="170" y1="210" x2="210" y2="160"/>
      <line x1="210" y1="160" x2="250" y2="130"/>
      <line x1="250" y1="130" x2="290" y2="120"/>
      <line x1="250" y1="130" x2="230" y2="180"/>
      <line x1="290" y1="120" x2="310" y2="195"/>
    </g>

    <!-- Node Points -->
    <circle cx="210" cy="160" r="3.5" fill="#38bdf8"/>
    <circle cx="250" cy="130" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="290" cy="120" r="3.5" fill="#10b981"/>

    <!-- Ping Packet Pulse at GW-01 -->
    <g transform="translate(365, 75)">
      <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.15"/>
      <circle cx="0" cy="0" r="8" fill="#10b981" opacity="0.3"/>
      <circle cx="0" cy="0" r="4" fill="#10b981"/>
      <text x="-40" y="24" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="8.5" font-weight="700">ESP-NOW RX</text>
    </g>

    <!-- Bottom Spectral Details -->
    <g transform="translate(30, 290)">
      <text x="0" y="16" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5">0 Hz</text>
      <text x="90" y="16" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5">1 kHz</text>
      <text x="180" y="16" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5">10 kHz</text>
      <text x="270" y="16" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5">24 kHz</text>
      <text x="350" y="16" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">FFT 2048</text>
    </g>
  </g>
</svg>
